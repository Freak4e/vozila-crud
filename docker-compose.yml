services:
  db:
    image: ${DOCKERHUB_USER}/vozila-db:${IMAGE_TAG}
    environment:
      POSTGRES_DB: ${PGDATABASE}
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vozila_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    image: ${DOCKERHUB_USER}/vozila-api:${IMAGE_TAG}
    environment:
      PORT: "3000"
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${PGDATABASE}
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
    ports:
      - "${PORT}:3000"
    networks:
      - vozila_network
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

networks:
  vozila_network:
    driver: bridge